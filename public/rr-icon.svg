<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="rrGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="#07070d" stroke="url(#rrGrad)" stroke-width="2.5" />
  <circle cx="50" cy="50" r="38" fill="url(#rrGrad)" opacity="0.12" filter="url(#glow)" />
  <text x="50" y="62" font-family="'Syne', sans-serif" font-size="34" font-weight="900" fill="url(#rrGrad)" text-anchor="middle" letter-spacing="-1">RR</text>
</svg>

